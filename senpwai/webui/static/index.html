<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Senpweb</title>
  <style>
    :root {
      --bg:        #0f0f1a;
      --card:      #1a1a2e;
      --border:    #2a2a4a;
      --primary:   #7c4dff;
      --primary-h: #9c6dff;
      --cyan:      #00e5ff;
      --text:      #e0e0e0;
      --muted:     #888;
      --success:   #4caf50;
      --error:     #f44336;
      --warn:      #ff9800;
      --radius:    10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; font-size: 14px; min-height: 100vh; }

    /* Header */
    header {
      position: sticky; top: 0; z-index: 100;
      background: var(--card); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; height: 52px;
    }
    header h1 { font-size: 20px; color: var(--primary); letter-spacing: 1px; }
    #active-badge {
      background: var(--primary); color: #fff; border-radius: 20px;
      padding: 3px 10px; font-size: 12px; font-weight: 600;
      display: none;
    }
    #active-badge.visible { display: inline-block; }

    /* Layout */
    main { max-width: 860px; margin: 0 auto; padding: 20px 16px 60px; }

    /* Cards */
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px; margin-bottom: 16px;
    }
    .card-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: var(--cyan); }

    /* Buttons */
    button {
      cursor: pointer; border: none; border-radius: 6px;
      padding: 7px 14px; font-size: 13px; font-weight: 500; transition: opacity .15s;
    }
    button:hover { opacity: .85; }
    button:disabled { opacity: .4; cursor: default; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-danger { background: var(--error); color: #fff; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }

    /* Search row */
    .search-row { display: flex; gap: 8px; }
    .search-row input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 7px 10px; font-size: 13px; }
    .search-row input:focus { outline: none; border-color: var(--primary); }

    /* Results */
    #search-results { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
    .result-item {
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      padding: 8px 12px; cursor: pointer; transition: border-color .15s;
      display: flex; align-items: center; gap: 10px;
    }
    .result-item:hover { border-color: var(--primary); }
    .result-item.selected { border-color: var(--primary); background: #1e1040; }
    /* Fixed box so rows don't jump as thumbnails stream in, and so rows without a
       poster stay aligned with the ones that have one. */
    .result-thumb {
      flex: 0 0 auto; width: 40px; height: 56px; border-radius: 4px;
      object-fit: cover; background: var(--border);
    }
    .result-title { min-width: 0; overflow-wrap: anywhere; }

    /* Anime details panel */
    #details-panel { display: none; }
    #details-panel.visible { display: block; }
    .details-inner { display: flex; gap: 14px; }
    .details-poster { width: 90px; flex-shrink: 0; }
    .details-poster img { width: 90px; border-radius: 6px; display: block; }
    .details-info { flex: 1; min-width: 0; }
    .details-info h3 { font-size: 15px; margin-bottom: 4px; }
    .details-info .meta { color: var(--muted); font-size: 12px; margin-bottom: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
    .details-info .summary { color: var(--muted); font-size: 12px; line-height: 1.5; max-height: 100px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

    /* Download options */
    .dl-options { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; align-items: flex-end; }
    .dl-field { display: flex; flex-direction: column; gap: 4px; }
    .dl-field label { font-size: 11px; color: var(--muted); }
    .dl-field input, .dl-field select {
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); padding: 6px 8px; font-size: 13px; width: 100px;
    }
    .dl-field input:focus, .dl-field select:focus { outline: none; border-color: var(--primary); }
    .dl-field select option { background: var(--card); }
    #hls-field { display: none; }
    #hls-field.visible { display: flex; }

    /* Badges */
    .badge {
      display: inline-block; border-radius: 20px; padding: 2px 8px;
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px;
    }
    .badge-queued    { background: #333; color: var(--muted); }
    .badge-resolving { background: #1a3a5c; color: var(--cyan); }
    .badge-downloading { background: #1a2e5c; color: #6699ff; }
    .badge-done      { background: #1a3a1a; color: var(--success); }
    .badge-failed    { background: #3a1a1a; color: var(--error); }
    .badge-cancelled { background: #2a2a2a; color: var(--muted); }
    .badge-skipped   { background: #3a2a0a; color: var(--warn); }
    .badge-pahe      { background: #2a1a4a; color: #b388ff; }
    .badge-dub       { background: #3a2a0a; color: var(--warn); }

    /* Queue */
    #queue-section h2 { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
    #queue-list { display: flex; flex-direction: column; gap: 10px; }
    #queue-empty { color: var(--muted); text-align: center; padding: 32px 0; display: none; }
    #queue-empty.visible { display: block; }

    /* Job card */
    .job-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .job-header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; flex-wrap: wrap; }
    /* A 180px floor on the flex-basis: with `flex: 1` alone the title could shrink to
       nothing ("E…") before the buttons wrapped onto their own row. */
    .job-title { flex: 1 1 180px; min-width: 0; font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* Wraps: with several buttons (Retry, Retry N episodes, Remove) a failed job's
       header is wider than a phone, and .job-card's overflow:hidden clipped the rest. */
    .job-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
    .job-range { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .job-body { padding: 0 14px 12px; }

    /* Progress bars */
    .resolve-bar { margin-bottom: 8px; }
    .resolve-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; display: flex; justify-content: space-between; }
    progress { width: 100%; height: 6px; border-radius: 3px; border: none; appearance: none; }
    progress::-webkit-progress-bar { background: var(--bg); border-radius: 3px; }
    progress::-webkit-progress-value { background: var(--primary); border-radius: 3px; transition: width .3s; }
    progress::-moz-progress-bar { background: var(--primary); border-radius: 3px; }

    .ep-list { display: flex; flex-direction: column; gap: 6px; }
    .ep-row { font-size: 12px; }
    .ep-summary {
      margin-top: 8px; font-size: 12px; color: var(--warn);
    }
    .ep-name { color: var(--muted); margin-bottom: 3px; display: flex; justify-content: space-between; gap: 8px; min-width: 0; }
    .ep-name > span:first-child { min-width: 0; overflow-wrap: anywhere; }
    .ep-name span { color: var(--text); }
    progress.ep-bar { height: 5px; }
    progress.ep-bar::-webkit-progress-value { background: var(--cyan); }
    progress.ep-bar::-moz-progress-bar { background: var(--cyan); }
    progress.ep-done::-webkit-progress-value { background: var(--success); }
    progress.ep-done::-moz-progress-bar { background: var(--success); }

    /* Errors: a wrapped one-line summary, with everything else behind "Details".
       Nothing here truncates; long text wraps and long blocks scroll. */
    .err { color: var(--error); font-size: 12px; margin-top: 6px; background: #2a0a0a; border-radius: 6px; padding: 8px 10px; min-width: 0; }
    .err.warn { color: var(--warn); background: #2a1c06; }
    .err-summary { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.45; }
    .err-details { margin: 6px 0 0; }
    .err-details summary { font-size: 11px; font-weight: 500; color: var(--muted); padding: 2px 0; }
    .err-body { margin-top: 6px; color: var(--text); }
    .err-grid { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 10px; font-size: 11px; }
    .err-grid dt { color: var(--muted); }
    .err-grid dd { white-space: pre-wrap; overflow-wrap: anywhere; }
    .err-label { margin-top: 8px; font-size: 11px; color: var(--muted); }
    .err-pre {
      margin-top: 3px; max-height: 260px; overflow: auto;
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px;
      font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text);
    }
    .err-actions { margin-top: 8px; }
    .conn-note { color: var(--warn); font-size: 11px; margin-top: 6px; }

    /* Toasts: errors stay until dismissed, success messages fade out. */
    #toasts {
      position: fixed; right: 16px; bottom: 16px; z-index: 200;
      width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 80px);
      display: flex; flex-direction: column; gap: 8px; overflow-y: auto; pointer-events: none;
    }
    .toast {
      pointer-events: auto; display: flex; align-items: flex-start; gap: 8px;
      background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--cyan);
      border-radius: 8px; padding: 10px 12px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.4);
    }
    .toast.error { border-left-color: var(--error); }
    .toast.success { border-left-color: var(--success); }
    .toast-body { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .toast-body .err { margin-top: 0; padding: 0; background: transparent; }
    .toast-close { background: transparent; color: var(--muted); padding: 0 4px; font-size: 18px; line-height: 1; }

    /* Settings */
    details { margin-bottom: 16px; }
    summary { cursor: pointer; font-size: 15px; font-weight: 600; color: var(--cyan); padding: 8px 0; list-style: none; display: flex; align-items: center; gap: 6px; }
    summary::before { content: '▶'; font-size: 10px; transition: transform .2s; }
    details[open] summary::before { transform: rotate(90deg); }
    .settings-grid { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
    .settings-field { display: flex; flex-direction: column; gap: 4px; }
    .settings-field label { font-size: 11px; color: var(--muted); }
    .settings-field select, .settings-field input {
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); padding: 6px 8px; font-size: 13px;
    }
    .settings-field select:focus, .settings-field input:focus { outline: none; border-color: var(--primary); }
    .folder-list { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
    .folder-item { font-size: 12px; color: var(--muted); background: var(--bg); border-radius: 4px; padding: 4px 8px; }
    .save-row { margin-top: 14px; display: flex; align-items: center; gap: 10px; }
    #save-msg { font-size: 12px; color: var(--success); display: none; }
    #save-msg.visible { display: inline; }

    /* Spinner */
    .spinner {
      display: inline-block; width: 12px; height: 12px;
      border: 2px solid var(--border); border-top-color: var(--cyan);
      border-radius: 50%; animation: spin .6s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Loading overlay for search */
    #search-loading { display: none; color: var(--muted); font-size: 12px; margin-top: 8px; }
    #search-loading.visible { display: flex; align-items: center; gap: 6px; }
    #details-loading { display: none; color: var(--muted); font-size: 12px; padding: 12px 0; }
    #details-loading.visible { display: flex; align-items: center; gap: 6px; }
  </style>
</head>
<body>

<header>
  <h1>Senpweb</h1>
  <span id="active-badge">0 active</span>
</header>

<main>
  <!-- Search -->
  <div class="card">
    <div class="card-title">Search</div>
    <div class="search-row">
      <input type="text" id="search-input" placeholder="Search anime..." onkeydown="if(event.key==='Enter') doSearch()">
      <button class="btn-primary" onclick="doSearch()" id="search-btn">Search</button>
    </div>
    <div id="search-loading"><span class="spinner"></span> Searching...</div>
    <div id="search-results"></div>
  </div>

  <!-- Details panel -->
  <div class="card" id="details-panel">
    <div id="details-loading"><span class="spinner"></span> Fetching details...</div>
    <!-- Separate from #details-content so a failed fetch can't wipe the form. -->
    <div id="details-error"></div>
    <div id="details-content" style="display:none">
      <div class="details-inner">
        <div class="details-poster"><img id="poster-img" src="" alt="poster"></div>
        <div class="details-info">
          <h3 id="details-title"></h3>
          <div class="meta" id="details-meta"></div>
          <div class="summary" id="details-summary"></div>
        </div>
      </div>
      <div class="dl-options">
        <div class="dl-field">
          <label>Start episode</label>
          <input type="number" id="start-ep" min="1" value="1">
        </div>
        <div class="dl-field">
          <label>End episode</label>
          <input type="number" id="end-ep" min="1" value="1">
        </div>
        <div class="dl-field">
          <label>Quality</label>
          <select id="quality-sel">
            <option value="1080p">1080p</option>
            <option value="720p" selected>720p</option>
            <option value="480p">480p</option>
            <option value="360p">360p</option>
          </select>
        </div>
        <div class="dl-field">
          <label>Sub / Dub</label>
          <select id="subdub-sel">
            <option value="sub" selected>Sub</option>
            <option value="dub">Dub</option>
          </select>
        </div>
        <div class="dl-field" style="flex-direction:row;align-items:center;gap:8px;margin-left:auto">
          <button class="btn-primary" onclick="addToQueue()" id="add-btn">Add to Queue</button>
          <button class="btn-ghost" onclick="browserDownload()" id="browser-dl-btn">⬇ Download to Browser</button>
          <button class="btn-ghost" onclick="trackCurrentAnime()" id="track-btn">☆ Track this anime</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Queue -->
  <div id="queue-section">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <h2 style="margin:0">Downloads</h2>
      <button class="btn-primary btn-sm" onclick="startAll()">▶ Start All</button>
    </div>
    <div id="queue-empty" class="visible">No downloads yet.</div>
    <div id="queue-list"></div>
  </div>

  <!-- Tracking -->
  <details open>
    <summary>Tracking</summary>
    <div class="card">
      <div style="font-size:12px;color:var(--muted);margin-bottom:8px">
        Tracked anime are checked for new episodes every <span id="track-interval-label">24</span>h and
        auto-downloaded until they finish airing.
      </div>
      <div id="tracking-empty" style="color:var(--muted);font-size:12px">Not tracking anything yet.</div>
      <div id="tracking-list"></div>
      <div class="save-row">
        <button class="btn-ghost btn-sm" onclick="checkTrackingNow()" id="check-tracking-btn">Check now</button>
      </div>
      <div id="tracking-events" style="margin-top:10px"></div>
    </div>
  </details>

  <!-- Settings -->
  <details>
    <summary>Settings</summary>
    <div class="card">
      <div class="settings-grid">
        <div class="settings-field">
          <label>Default quality</label>
          <select id="s-quality">
            <option value="1080p">1080p</option>
            <option value="720p">720p</option>
            <option value="480p">480p</option>
            <option value="360p">360p</option>
          </select>
        </div>
        <div class="settings-field">
          <label>Default sub / dub</label>
          <select id="s-subdub">
            <option value="sub">Sub</option>
            <option value="dub">Dub</option>
          </select>
        </div>
        <div class="settings-field">
          <label>Max simultaneous downloads</label>
          <input type="number" id="s-maxdl" min="1" max="10" style="width:80px">
        </div>
        <div class="settings-field">
          <label>Tracking check interval (hours)</label>
          <input type="number" id="s-trackinterval" min="1" max="720" style="width:80px">
        </div>
      </div>
      <div class="folder-list" id="folder-list"></div>
      <div class="save-row">
        <button class="btn-primary btn-sm" onclick="saveSettings()">Save</button>
        <span id="save-msg">Saved!</span>
      </div>
    </div>
  </details>
</main>

<div id="toasts" role="status" aria-live="polite"></div>

<script>
// Minimal ZIP builder using store (no compression) — fine for already-compressed video files.
class ZipBuilder {
  constructor() {
    this._entries = [];
    this._offset = 0;
  }

  addFile(name, arrayBuffer) {
    const nameBytes = new TextEncoder().encode(name);
    const data = new Uint8Array(arrayBuffer);
    const crc = ZipBuilder._crc32(data);
    this._entries.push({ nameBytes, data, crc, localOffset: this._offset });
    this._offset += 30 + nameBytes.length + data.length;
  }

  generate() {
    const parts = [];
    const cdParts = [];

    for (const e of this._entries) {
      const lh = new Uint8Array(30 + e.nameBytes.length);
      const lv = new DataView(lh.buffer);
      lv.setUint32(0,  0x04034b50, true); // local file header signature
      lv.setUint16(4,  20, true);          // version needed
      lv.setUint16(6,  0,  true);          // flags
      lv.setUint16(8,  0,  true);          // compression: stored
      lv.setUint16(10, 0,  true);          // mod time
      lv.setUint16(12, 0,  true);          // mod date
      lv.setUint32(14, e.crc,          true);
      lv.setUint32(18, e.data.length,  true); // compressed size
      lv.setUint32(22, e.data.length,  true); // uncompressed size
      lv.setUint16(26, e.nameBytes.length, true);
      lv.setUint16(28, 0, true);           // extra field length
      lh.set(e.nameBytes, 30);
      parts.push(lh, e.data);

      const cd = new Uint8Array(46 + e.nameBytes.length);
      const cv = new DataView(cd.buffer);
      cv.setUint32(0,  0x02014b50, true); // central dir signature
      cv.setUint16(4,  20, true);          // version made by
      cv.setUint16(6,  20, true);          // version needed
      cv.setUint16(8,  0,  true);          // flags
      cv.setUint16(10, 0,  true);          // compression: stored
      cv.setUint16(12, 0,  true);          // mod time
      cv.setUint16(14, 0,  true);          // mod date
      cv.setUint32(16, e.crc,          true);
      cv.setUint32(20, e.data.length,  true);
      cv.setUint32(24, e.data.length,  true);
      cv.setUint16(28, e.nameBytes.length, true);
      cv.setUint16(30, 0, true);           // extra length
      cv.setUint16(32, 0, true);           // comment length
      cv.setUint16(34, 0, true);           // disk number start
      cv.setUint16(36, 0, true);           // internal attrs
      cv.setUint32(38, 0, true);           // external attrs
      cv.setUint32(42, e.localOffset, true);
      cd.set(e.nameBytes, 46);
      cdParts.push(cd);
    }

    const cdOffset = this._offset;
    const cdSize = cdParts.reduce((s, p) => s + p.length, 0);
    const eocd = new Uint8Array(22);
    const ev = new DataView(eocd.buffer);
    ev.setUint32(0,  0x06054b50, true); // end of central dir signature
    ev.setUint16(4,  0, true);           // disk number
    ev.setUint16(6,  0, true);           // disk with central dir
    ev.setUint16(8,  this._entries.length, true);
    ev.setUint16(10, this._entries.length, true);
    ev.setUint32(12, cdSize,   true);
    ev.setUint32(16, cdOffset, true);
    ev.setUint16(20, 0, true);           // comment length

    return new Blob([...parts, ...cdParts, eocd], { type: 'application/zip' });
  }

  static _crc32(data) {
    if (!ZipBuilder._table) {
      ZipBuilder._table = new Uint32Array(256);
      for (let i = 0; i < 256; i++) {
        let c = i;
        for (let j = 0; j < 8; j++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        ZipBuilder._table[i] = c;
      }
    }
    let crc = 0xFFFFFFFF;
    for (let i = 0; i < data.length; i++) {
      crc = ZipBuilder._table[(crc ^ data[i]) & 0xFF] ^ (crc >>> 8);
    }
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }
}

const state = {
  site: 'pahe',  // always pahe now
  settings: {},
  results: [],
  selected: null,    // { title, page_link, anime_id }
  details: null,     // fetched AnimeDetails
  jobs: {},          // job_id -> snapshot
  sources: {},       // job_id -> EventSource
  tracking: null,    // { tracked_anime, tracking_site, tracking_interval_hrs, events }
  openErr: new Set(), // keys of error "Details" blocks the user has expanded
  sseDown: {},        // job_id -> 'reconnecting' | 'closed' while its event stream is down
};

// --- Utilities ---

function fmt(bytes) {
  if (!bytes) return '0 B';
  const k = 1024, s = ['B','KB','MB','GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return (bytes / k ** i).toFixed(1) + ' ' + s[i];
}

// --- Errors ---
//
// Every failure is shown the same way: a wrapped one-line summary, and (when there is
// more to know) a "Details" block with stage, URL, HTTP status, hint, response body and
// traceback plus a Copy button. The server sends this as {detail, error}; anything the
// browser raises itself is normalised into the same shape.

class ApiError extends Error {
  constructor(info, status) {
    super(info.summary);
    this.name = 'ApiError';
    this.info = info;
    this.status = status;
  }
}

function errorText(e) {
  const out = [e.summary];
  [['Stage', e.stage], ['Type', e.exc_type], ['URL', e.url],
   ['HTTP status', e.http_status], ['Attempts', e.attempts]].forEach(([k, v]) => {
    if (v !== null && v !== undefined && v !== '') out.push(`${k}: ${v}`);
  });
  // Extra labelled facts: content type, parser error, where the parse broke, ...
  Object.entries(e.details || {}).forEach(([k, v]) => out.push(`${k}: ${v}`));
  if (e.hint) out.push('', 'Hint:', e.hint);
  if (e.body_snippet) out.push('', 'Response body:', e.body_snippet);
  if (e.cause_chain && e.cause_chain.length) {
    out.push('', 'Caused by:', ...e.cause_chain.map(c => '  ' + c));
  }
  if (e.traceback) out.push('', 'Traceback:', e.traceback.trimEnd());
  return out.join('\n');
}

// Accepts an ApiError, Error, string, or a server ErrorInfo dict.
function normalizeError(x) {
  let info;
  if (x instanceof ApiError) info = x.info;
  else if (x instanceof Error) info = { summary: x.message || String(x), exc_type: x.name };
  else if (typeof x === 'string') info = { summary: x };
  else info = x || {};
  info = { ...info, summary: info.summary || 'Unknown error' };
  if (!info.text) info.text = errorText(info);
  return info;
}

const errStore = new Map(); // stable key -> plain-text details, for the Copy button

function renderError(x, key, variant) {
  const e = normalizeError(x);
  errStore.set(key, e.text);
  const present = v => v !== null && v !== undefined && v !== '';
  const rows = [['Stage', e.stage], ['Type', e.exc_type], ['URL', e.url],
                ['HTTP status', e.http_status], ['Attempts', e.attempts],
                ...Object.entries(e.details || {})]
    .filter(([, v]) => present(v));
  const blocks = [];
  if (e.hint) blocks.push(['Hint', e.hint]);
  if (e.body_snippet) blocks.push(['Response body', e.body_snippet]);
  if (e.cause_chain && e.cause_chain.length) blocks.push(['Caused by', e.cause_chain.join('\n')]);
  if (e.traceback) blocks.push(['Traceback', e.traceback.trimEnd()]);
  // A bare stage name isn't worth a toggle.
  const worthExpanding = blocks.length > 0 || rows.some(([k]) => k !== 'Stage');
  const k = escHtml(key);
  const details = worthExpanding ? `
    <details class="err-details"${state.openErr.has(key) ? ' open' : ''} data-k="${k}" ontoggle="onErrToggle(this)">
      <summary>Details</summary>
      <div class="err-body">
        ${rows.length ? `<dl class="err-grid">${rows.map(([n, v]) => `<dt>${n}</dt><dd>${escHtml(v)}</dd>`).join('')}</dl>` : ''}
        ${blocks.map(([t, b]) => `<div class="err-label">${t}</div><pre class="err-pre">${escHtml(b)}</pre>`).join('')}
        <div class="err-actions"><button class="btn-ghost btn-sm" data-k="${k}" onclick="copyErr(this)">Copy details</button></div>
      </div>
    </details>` : '';
  return `<div class="err${variant ? ' ' + variant : ''}"><div class="err-summary">${escHtml(e.summary)}</div>${details}</div>`;
}

// Job cards re-render every ~0.5s while downloading, which would snap an opened
// "Details" shut, so remember which ones the user opened.
function onErrToggle(el) {
  if (el.open) state.openErr.add(el.dataset.k);
  else state.openErr.delete(el.dataset.k);
}

async function copyErr(btn) {
  const text = errStore.get(btn.dataset.k) || '';
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    // navigator.clipboard is missing on plain-http origins other than localhost.
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch {}
    ta.remove();
  }
  const label = btn.textContent;
  btn.textContent = 'Copied ✓';
  setTimeout(() => { btn.textContent = label; }, 1500);
}

let toastSeq = 0;

// kind: 'error' (content is anything normalizeError takes; stays until dismissed)
//       'success' (content is a string; fades out).
function toast(kind, content) {
  const box = document.getElementById('toasts');
  const err = kind === 'error' ? normalizeError(content) : null;
  const summary = err ? err.summary : String(content);
  // Several requests failing for one cause (server down) shouldn't stack identical toasts.
  const repeat = [...box.children].some(
    t => t.dataset.summary === summary && Date.now() - Number(t.dataset.at) < 5000
  );
  if (repeat) return;
  const id = ++toastSeq;
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.dataset.summary = summary;
  el.dataset.at = String(Date.now());
  el.innerHTML = `<div class="toast-body">${err ? renderError(err, 'toast:' + id) : escHtml(summary)}</div>` +
    `<button class="toast-close" title="Dismiss" onclick="this.closest('.toast').remove()">×</button>`;
  box.appendChild(el);
  while (box.children.length > 4) box.firstElementChild.remove();
  if (!err) setTimeout(() => el.remove(), 2500);
}

function fail(x) {
  console.error(x);
  toast('error', x);
}

// fetch() that turns every failure into an ApiError carrying the server's explanation.
async function apiRaw(path, opts = {}) {
  const where = `${opts.method || 'GET'} ${path}`;
  let res;
  try {
    res = await fetch(path, opts);
  } catch (e) {
    throw new ApiError({
      summary: "Can't reach the Senpweb server",
      stage: where,
      exc_type: e.name,
      hint: `${e.message}\nIs senpweb still running? Reload the page once it is.`,
    }, 0);
  }
  if (res.ok) return res;
  const raw = await res.text();
  let body = null;
  try { body = JSON.parse(raw); } catch {}
  let info;
  if (body && body.detail !== undefined) {
    const detail = typeof body.detail === 'string' ? body.detail : JSON.stringify(body.detail);
    info = body.error
      ? { ...body.error, summary: detail, stage: body.error.stage || where }
      : { summary: detail, stage: where, http_status: res.status };
  } else {
    // Not our JSON: a reverse proxy's error page, or an unhandled crash.
    info = {
      summary: `Server returned HTTP ${res.status} ${res.statusText}`.trim(),
      stage: where,
      http_status: res.status,
      body_snippet: raw.slice(0, 2000),
      details: {
        'Content-Type': res.headers.get('content-type') || '(none)',
        'Response size': `${raw.length.toLocaleString()} chars`,
      },
    };
  }
  throw new ApiError(info, res.status);
}

async function api(path, opts = {}) {
  const res = await apiRaw(path, opts);
  const raw = await res.text();
  try {
    return JSON.parse(raw);
  } catch (err) {
    const ctype = res.headers.get('content-type') || 'no content-type';
    throw new ApiError({
      summary: `The server sent a response that is not JSON (HTTP ${res.status}, ${ctype}, ${raw.length.toLocaleString()} chars)`,
      stage: `${opts.method || 'GET'} ${path}`,
      url: path,
      http_status: res.status,
      body_snippet: raw.slice(0, 4000) + (raw.length > 4000 ? `\n…[${(raw.length - 4000).toLocaleString()} more chars not shown]` : ''),
      details: { 'Parser error': err.message },
    }, res.status);
  }
}

function jsonOpts(method, body) {
  return { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
}

function pct(done, total) {
  return total ? Math.min(100, Math.round(done / total * 100)) : 0;
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function doSearch() {
  const q = document.getElementById('search-input').value.trim();
  if (!q) return;
  document.getElementById('search-btn').disabled = true;
  document.getElementById('search-loading').classList.add('visible');
  document.getElementById('search-results').innerHTML = '';
  hideDetails();
  try {
    const data = await api(`/api/search?q=${encodeURIComponent(q)}&site=${state.site}`);
    state.results = data.results || [];
    renderResults();
  } catch(e) {
    console.error(e);
    document.getElementById('search-results').innerHTML = renderError(e, 'search');
  } finally {
    document.getElementById('search-btn').disabled = false;
    document.getElementById('search-loading').classList.remove('visible');
  }
}

function renderResults() {
  const el = document.getElementById('search-results');
  if (!state.results.length) {
    el.innerHTML = '<div style="color:var(--muted);font-size:12px;margin-top:8px">No results.</div>';
    return;
  }
  el.innerHTML = state.results.map((r, i) =>
    `<div class="result-item" onclick="selectAnime(${i})">${
       r.poster
         ? `<img class="result-thumb" loading="lazy" decoding="async" alt=""
                onerror="this.style.visibility='hidden'"
                src="/api/proxy-image?url=${encodeURIComponent(r.poster)}">`
         : `<div class="result-thumb"></div>`
     }<span class="result-title">${escHtml(r.title)}</span></div>`
  ).join('');
}

function hideDetails() {
  document.getElementById('details-panel').classList.remove('visible');
  document.getElementById('details-content').style.display = 'none';
  document.getElementById('details-loading').classList.remove('visible');
  document.getElementById('details-error').innerHTML = '';

  state.details = null;
}

async function selectAnime(idx) {
  // Highlight selected result
  document.querySelectorAll('.result-item').forEach((el, i) =>
    el.classList.toggle('selected', i === idx)
  );

  const r = state.results[idx];
  state.selected = r;
  state.details = null;

  const panel = document.getElementById('details-panel');
  panel.classList.add('visible');
  document.getElementById('details-content').style.display = 'none';
  document.getElementById('details-error').innerHTML = '';
  document.getElementById('details-loading').classList.add('visible');

  try {
    state.details = await api('/api/anime/details', jsonOpts('POST', {
      title: r.title,
      page_link: r.page_link,
      anime_id: r.anime_id,
      site: state.site,
    }));
    renderDetails();
  } catch(e) {
    // Shown beside, not instead of, #details-content: overwriting that element used to
    // destroy the episode form, so the next successful selection had nothing to fill.
    console.error(e);
    document.getElementById('details-loading').classList.remove('visible');
    document.getElementById('details-error').innerHTML =
      `<div style="font-weight:600;margin-bottom:4px">Couldn't load details for ${escHtml(r.title)}</div>` +
      renderError(e, 'details');
  }
}

function renderDetails() {
  const d = state.details;
  document.getElementById('details-loading').classList.remove('visible');

  document.getElementById('poster-img').src = d.poster_url ? `/api/proxy-image?url=${encodeURIComponent(d.poster_url)}` : '';
  document.getElementById('details-title').textContent = state.selected.title;

  const meta = [];
  meta.push(`<span class="badge badge-pahe">Pahe</span>`);
  meta.push(`${d.episode_count} episodes`);
  if (d.release_year) meta.push(d.release_year);
  meta.push(`<span style="color:${d.airing_status === 'Ongoing' ? 'var(--warn)' : d.airing_status === 'Finished' ? 'var(--success)' : 'var(--muted)'}">${d.airing_status}</span>`);
  if (d.dub_available) meta.push('<span class="badge badge-dub">Dub ✓</span>');
  document.getElementById('details-meta').innerHTML = meta.join(' · ');
  document.getElementById('details-summary').textContent = d.summary || '';

  // Smart episode range defaults
  const startEp = (d.haved_end && d.haved_end < d.episode_count) ? d.haved_end + 1 : 1;
  document.getElementById('start-ep').value = startEp;
  document.getElementById('end-ep').value = d.episode_count;
  document.getElementById('end-ep').max = d.episode_count;
  document.getElementById('start-ep').max = d.episode_count;

  // Apply settings defaults
  document.getElementById('quality-sel').value = state.settings.quality || '720p';
  document.getElementById('subdub-sel').value = state.settings.sub_or_dub || 'sub';

  document.getElementById('details-content').style.display = 'block';
}

async function addToQueue() {
  if (!state.selected) return;
  const btn = document.getElementById('add-btn');
  btn.disabled = true;
  try {
    const body = {
      title:         state.selected.title,
      page_link:     state.selected.page_link,
      anime_id:      state.selected.anime_id,
      site:          state.site,
      start_episode: parseInt(document.getElementById('start-ep').value),
      end_episode:   parseInt(document.getElementById('end-ep').value),
      quality:       document.getElementById('quality-sel').value,
      sub_or_dub:    document.getElementById('subdub-sel').value,
      hls_mode:      false,
    };
    const { job_id } = await api('/api/queue', jsonOpts('POST', body));
    subscribeSSE(job_id);
  } catch(e) {
    fail(e);
  } finally {
    btn.disabled = false;
  }
}

async function browserDownload() {
  if (!state.selected) return;
  const btn = document.getElementById('browser-dl-btn');
  btn.disabled = true;
  btn.textContent = 'Resolving...';
  try {
    const body = {
      title:         state.selected.title,
      page_link:     state.selected.page_link,
      anime_id:      state.selected.anime_id,
      start_episode: parseInt(document.getElementById('start-ep').value),
      end_episode:   parseInt(document.getElementById('end-ep').value),
      quality:       document.getElementById('quality-sel').value,
      sub_or_dub:    document.getElementById('subdub-sel').value,
    };
    const { episodes, skipped } = await api(
      '/api/browser-download/resolve', jsonOpts('POST', body)
    );
    // Whatever did resolve is still downloaded; say what didn't, and why.
    if (skipped && skipped.length) {
      toast('error', {
        summary: `${skipped.length} episode(s) couldn't be resolved and won't be downloaded`,
        stage: 'browser download',
        hint: skipped.map(s => `${s.title}: ${s.reason}`).join('\n'),
      });
    }

    if (episodes.length === 1) {
      const a = document.createElement('a');
      a.href = `/api/browser-download/${episodes[0].token}`;
      a.download = episodes[0].title + '.mp4';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    } else {
      const zip = new ZipBuilder();
      for (let i = 0; i < episodes.length; i++) {
        btn.textContent = `Fetching ${i + 1} / ${episodes.length}...`;
        let epRes;
        try {
          epRes = await apiRaw(`/api/browser-download/${episodes[i].token}`);
        } catch (err) {
          const info = normalizeError(err);
          throw new ApiError(
            { ...info, summary: `${episodes[i].title}: ${info.summary}`, text: undefined },
            err.status || 0
          );
        }
        const data = await epRes.arrayBuffer();
        zip.addFile(episodes[i].title + '.mp4', data);
      }
      btn.textContent = 'Zipping...';
      const blob = zip.generate();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = state.selected.title + '.zip';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  } catch(e) {
    fail(e);
  } finally {
    btn.disabled = false;
    btn.textContent = '⬇ Download to Browser';
  }
}

async function removeJob(job_id) {
  try {
    await api(`/api/queue/${job_id}`, { method: 'DELETE' });
  } catch (e) {
    // 404 just means the server already forgot the job (e.g. it restarted); the card
    // should still go away. Anything else is worth knowing about.
    if (!(e instanceof ApiError && e.status === 404)) fail(e);
  }
  delete state.jobs[job_id];
  if (state.sources[job_id]) { state.sources[job_id].close(); delete state.sources[job_id]; }
  const el = document.getElementById('job-' + job_id);
  if (el) el.remove();
  document.getElementById('queue-empty').classList.toggle('visible', Object.keys(state.jobs).length === 0);
  updateActiveBadge();
}

// --- SSE ---

function subscribeSSE(job_id) {
  if (state.sources[job_id]) return;
  const es = new EventSource(`/api/queue/${job_id}/events`);
  state.sources[job_id] = es;
  es.onmessage = (e) => {
    const snap = JSON.parse(e.data);
    delete state.sseDown[snap.job_id];
    state.jobs[snap.job_id] = snap;
    renderJobCard(snap.job_id);
    updateActiveBadge();
    if (['done','failed','cancelled'].includes(snap.status)) {
      es.close();
      delete state.sources[snap.job_id];
    }
  };
  // EventSource retries on its own, but a silent stall looks like a hung download.
  // CLOSED means the browser gave up (e.g. the server answered with an error status).
  es.onerror = () => {
    state.sseDown[job_id] = es.readyState === EventSource.CLOSED ? 'closed' : 'reconnecting';
    renderJobCard(job_id);
  };
}

// --- Rendering ---

function updateActiveBadge() {
  const active = Object.values(state.jobs).filter(j =>
    ['queued','resolving','downloading'].includes(j.status)
  ).length;
  const badge = document.getElementById('active-badge');
  badge.textContent = active + ' active';
  badge.classList.toggle('visible', active > 0);
}

function renderQueue() {
  const jobs = Object.values(state.jobs).sort((a, b) => b.created_at - a.created_at);
  document.getElementById('queue-empty').classList.toggle('visible', jobs.length === 0);
  const list = document.getElementById('queue-list');
  // Only add cards for new jobs; existing ones are updated in-place by renderJobCard
  jobs.forEach(j => {
    if (!document.getElementById('job-' + j.job_id)) {
      const div = document.createElement('div');
      div.id = 'job-' + j.job_id;
      div.className = 'job-card';
      list.prepend(div);
    }
    renderJobCard(j.job_id);
  });
  updateActiveBadge();
}

function renderJobCard(job_id) {
  const j = state.jobs[job_id];
  if (!j) return;
  let el = document.getElementById('job-' + job_id);
  if (!el) {
    el = document.createElement('div');
    el.id = 'job-' + job_id;
    el.className = 'job-card';
    document.getElementById('queue-list').prepend(el);
    document.getElementById('queue-empty').classList.remove('visible');
  }

  const siteBadge = `<span class="badge badge-${j.site}">${j.site}</span>`;
  const statusBadge = `<span class="badge badge-${j.status}">${j.status}</span>`;
  const epRange = `Ep ${j.start_episode}–${j.end_episode}`;
  const isTerminal = ['done','failed','cancelled'].includes(j.status);
  const isQueued = j.status === 'queued';

  let bodyHtml = '';

  if (j.status === 'resolving' && j.resolve_total > 0) {
    const p = pct(j.resolve_current, j.resolve_total);
    bodyHtml = `
      <div class="resolve-bar">
        <div class="resolve-label">
          <span><span class="spinner"></span>${escHtml(j.resolve_step)}</span>
          <span>${j.resolve_current}/${j.resolve_total}</span>
        </div>
        <progress value="${j.resolve_current}" max="${j.resolve_total}"></progress>
      </div>`;
  } else if (j.status === 'resolving') {
    bodyHtml = `<div style="color:var(--muted);font-size:12px"><span class="spinner"></span>${escHtml(j.resolve_step) || 'Preparing...'}</div>`;
  } else if ((j.status === 'downloading' || isTerminal) && j.episodes.length > 0) {
    const epRows = j.episodes.map(ep => {
      const done = ep.status === 'done';
      // An episode that never resolved has no link and so no progress bar to show —
      // it gets the reason instead, which is the whole point of surfacing it.
      if (ep.status === 'skipped' || ep.status === 'failed') {
        const label = ep.status === 'skipped' ? 'skipped' : 'failed';
        const errKey = `${job_id}:${ep.episode_number ?? ep.episode_title}`;
        const reason = ep.error_detail || ep.error;
        return `<div class="ep-row">
          <div class="ep-name">
            <span>${escHtml(ep.episode_title)}</span>
            <span class="badge badge-${ep.status}">${label}</span>
          </div>
          ${reason ? renderError(reason, errKey, ep.status === 'skipped' ? 'warn' : '') : ''}
        </div>`;
      }
      const cls = done ? 'ep-done' : '';
      const sizeStr = ep.total_bytes ? `${fmt(ep.downloaded_bytes)} / ${fmt(ep.total_bytes)}` : '';
      return `<div class="ep-row">
        <div class="ep-name"><span>${escHtml(ep.episode_title)}</span><span>${sizeStr}</span></div>
        <progress class="ep-bar ${cls}" value="${ep.downloaded_bytes}" max="${ep.total_bytes || 1}"></progress>
      </div>`;
    }).join('');
    bodyHtml = `<div class="ep-list">${epRows}</div>`;
    const nSkipped = j.episodes.filter(ep => ep.status === 'skipped').length;
    const nFailed = j.episodes.filter(ep => ep.status === 'failed').length;
    if (isTerminal && (nSkipped || nFailed)) {
      const parts = [];
      if (nFailed) parts.push(`${nFailed} failed`);
      if (nSkipped) parts.push(`${nSkipped} skipped`);
      bodyHtml += `<div class="ep-summary">${parts.join(', ')} — not downloaded.</div>`;
    }
  } else if (j.status === 'queued') {
    bodyHtml = `<div style="color:var(--muted);font-size:12px">Waiting to start...</div>`;
  }

  if (j.error_message) {
    bodyHtml += renderError(j.error_detail || j.error_message, `${job_id}:job`);
  }
  if (state.sseDown[job_id] && !isTerminal) {
    bodyHtml += `<div class="conn-note">${state.sseDown[job_id] === 'closed'
      ? 'Lost the connection to the server. Reload the page to see progress again.'
      : 'Connection lost, reconnecting…'}</div>`;
  }

  const startBtn = isQueued
    ? `<button class="btn-primary btn-sm" onclick="startJob('${job_id}')">▶ Start</button>`
    : '';
  const retryBtn = j.status === 'failed'
    ? `<button class="btn-primary btn-sm" onclick="retryJob('${job_id}')">↺ Retry</button>`
    : '';
  const nIncomplete = j.episodes.filter(
    ep => (ep.status === 'skipped' || ep.status === 'failed') && ep.episode_number !== null
  ).length;
  const retryEpsBtn = isTerminal && nIncomplete
    ? `<button class="btn-primary btn-sm" onclick="retryEpisodes('${job_id}')"
               title="Queue a new job for just these episodes">↺ Retry ${nIncomplete} episode${nIncomplete > 1 ? 's' : ''}</button>`
    : '';
  const removeBtn = isTerminal
    ? `<button class="btn-ghost btn-sm" onclick="removeJob('${job_id}')">Remove</button>`
    : `<button class="btn-danger btn-sm" onclick="removeJob('${job_id}')">Cancel</button>`;

  el.innerHTML = `
    <div class="job-header">
      <div class="job-title" title="${escHtml(j.anime_title)}">${escHtml(j.anime_title)}</div>
      <div class="job-meta">
        ${siteBadge}
        <span class="job-range">${epRange}</span>
        ${statusBadge}
        ${startBtn}
        ${retryBtn}
        ${retryEpsBtn}
        ${removeBtn}
      </div>
    </div>
    ${bodyHtml ? `<div class="job-body">${bodyHtml}</div>` : ''}
  `;
}

      folders.length
        ? '<div style="font-size:11px;color:var(--muted);margin-top:8px">Download folders:</div>' +
          folders.map(f => `<div class="folder-item">${escHtml(f)}</div>`).join('')
        : '';
  } catch (e) {
    fail(e);
  }
}

async function saveSettings() {
  const body = {
    quality:                   document.getElementById('s-quality').value,
    sub_or_dub:                document.getElementById('s-subdub').value,
    max_simultaneous_downloads: parseInt(document.getElementById('s-maxdl').value),
    tracking_interval_hrs:      parseInt(document.getElementById('s-trackinterval').value),
  };
  try {
    // Throws on a 4xx/5xx, so "Saved!" is only ever shown after a real save.
    await api('/api/settings', jsonOpts('PATCH', body));
    state.settings = { ...state.settings, ...body };
    document.getElementById('track-interval-label').textContent = body.tracking_interval_hrs;
    const msg = document.getElementById('save-msg');
    msg.classList.add('visible');
    setTimeout(() => msg.classList.remove('visible'), 2000);
  } catch(e) {
    fail(e);
  }
}

// --- Tracking ---

async function loadTracking() {
  try {
    const data = await api('/api/tracking');
    state.tracking = data;
    document.getElementById('track-interval-label').textContent = data.tracking_interval_hrs;
    renderTracking();
  } catch (e) {
    fail(e);
  }
}

function renderTracking() {
  const t = state.tracking || { tracked_anime: [], events: [] };
  const list = document.getElementById('tracking-list');
  const empty = document.getElementById('tracking-empty');
  if (!t.tracked_anime.length) {
    empty.style.display = 'block';
    list.innerHTML = '';
  } else {
    empty.style.display = 'none';
    list.innerHTML = t.tracked_anime.map(title => `
      <div class="folder-item" style="display:flex;align-items:center;justify-content:space-between;gap:8px">
        <span>${escHtml(title)}</span>
        <button class="btn-danger btn-sm" data-untrack-title="${escHtml(title)}">✕</button>
      </div>
    `).join('');
  }

  const events = document.getElementById('tracking-events');
  events.innerHTML = t.events && t.events.length
    ? t.events.slice().reverse().map(e => e.kind === 'error' ? `
        <div style="font-size:11px;color:var(--muted);margin-top:6px">${new Date(e.time * 1000).toLocaleString()}</div>
        ${renderError({ ...(e.detail || {}), summary: e.message, text: undefined }, 'track:' + e.time)}
      ` : `
        <div style="font-size:11px;color:var(--muted);margin-top:4px">
          ${new Date(e.time * 1000).toLocaleString()} — ${escHtml(e.message)}
        </div>
      `).join('')
    : '';
}

async function trackCurrentAnime() {
  if (!state.selected) return;
  const btn = document.getElementById('track-btn');
  btn.disabled = true;
  try {
    await api('/api/tracking', jsonOpts('POST', { title: state.selected.title }));
    await loadTracking();
  } catch(e) {
    fail(e);
  } finally {
    btn.disabled = false;
  }
}

async function untrackAnime(title) {
  try {
    await api(`/api/tracking/${encodeURIComponent(title)}`, { method: 'DELETE' });
    await loadTracking();
  } catch(e) {
    fail(e);
  }
}

async function checkTrackingNow() {
  const btn = document.getElementById('check-tracking-btn');
  btn.disabled = true;
  const original = btn.textContent;
  btn.textContent = 'Checking...';
  try {
    const data = await api('/api/tracking/check', { method: 'POST' });
    state.tracking = { ...state.tracking, events: data.events };
    await loadTracking();
    await loadQueue();
  } catch(e) {
    fail(e);
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
}

// --- Start ---

async function startJob(job_id) {
  try {
    await api(`/api/queue/${job_id}/start`, { method: 'POST' });
    subscribeSSE(job_id);
  } catch (e) {
    fail(e);
  }
}

async function retryJob(job_id) {
  try {
    await api(`/api/queue/${job_id}/retry`, { method: 'POST' });
    subscribeSSE(job_id);
  } catch (e) {
    fail(e);
  }
}

async function retryEpisodes(job_id) {
  try {
    // The retry is a new job so the original keeps showing what did download.
    const { job_id: newId } = await api(`/api/queue/${job_id}/retry-episodes`, { method: 'POST' });
    await loadQueue();
    subscribeSSE(newId);
  } catch (e) {
    fail(e);
  }
}

async function startAll() {
  try {
    await api('/api/queue/start-all', { method: 'POST' });
    Object.keys(state.jobs).forEach(id => {
      if (state.jobs[id].status === 'queued') subscribeSSE(id);
    });
  } catch (e) {
    fail(e);
  }
}

// --- Init ---

async function loadQueue() {
  try {
    const { jobs } = await api('/api/queue');
    jobs.forEach(j => {
      state.jobs[j.job_id] = j;
      if (!['done','failed','cancelled'].includes(j.status)) {
        subscribeSSE(j.job_id);
      }
    });
    renderQueue();
  } catch (e) {
    fail(e);
  }
}

async function init() {
  await loadSettings();
  await loadQueue();
  await loadTracking();
}

document.getElementById('tracking-list').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-untrack-title]');
  if (btn) untrackAnime(btn.dataset.untrackTitle);
});

init();
</script>
</body>
</html>
